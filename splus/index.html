
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b08">
  <title>NEXORA | پیام‌رسان</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: #080b08;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
      padding: 45px 25px;
      background: #101510;
      border: 1px solid #1c3d20;
      border-radius: 24px;
      box-shadow: 0 0 45px #00ff3510;
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
      color: #39ff57;
      letter-spacing: 3px;
      text-shadow: 0 0 25px #39ff5760;
    }

    .subtitle {
      color: #858f85;
      font-size: 14px;
      margin-top: 8px;
    }

    .line {
      width: 55px;
      height: 3px;
      background: #39ff57;
      margin: 28px auto;
      border-radius: 10px;
      box-shadow: 0 0 15px #39ff57;
    }

    .description {
      color: #c2c9c2;
      font-size: 14px;
      line-height: 2;
      margin-bottom: 30px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      background: #39ff57;
      color: #071008;
      text-decoration: none;
      font-weight: 900;
      border-radius: 12px;
      transition: .2s;
    }

    .btn:hover {
      background: #65ff7b;
      box-shadow: 0 0 25px #39ff5760;
      transform: translateY(-2px);
    }

    .secondary {
      display: block;
      margin-top: 18px;
      color: #39ff57;
      font-size: 13px;
      text-decoration: none;
    }

    footer {
      margin-top: 35px;
      color: #596159;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">NEXORA</div>
    <div class="subtitle">نسل جدید ارتباطات</div>

    <div class="line"></div>

    <p class="description">
      به دنیای NEXORA خوش آمدید.<br>
      سریع، ساده و متفاوت.
    </p>

    <a class="btn" href="https://web.splus.ir/" target="_blank">
      ورود به پیام‌رسان
    </a>

    <a class="secondary" href="nexora.user.js">
      دریافت اسکریپت تغییر برند NEXORA
    </a>

    <footer>
      NEXORA © 2026 — All rights reserved
    </footer>
  </main>
</body>
</html>
