<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>سیبیلستر</title>

    <style>

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            background: #111318;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
        }

        .بازی {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            margin: auto;
            padding: 20px;
            text-align: center;
        }

        .عنوان {
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
        }

        .سکه {
            margin-top: 35px;
        }

        .سکه-عدد {
            font-size: 42px;
            font-weight: bold;
        }

        .سکه-متن {
            color: #999;
            margin-top: 5px;
        }

        /* سیبیلستر */

        .سیبیلستر {
            width: 220px;
            height: 220px;

            margin: 40px auto;

            border-radius: 50%;

            background: #d99a62;

            border: 8px solid #f0bd86;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 100px;

            cursor: pointer;

            transition: transform 0.08s;
        }

        .سیبیلستر:active {
            transform: scale(0.92);
        }

        /* انرژی */

        .انرژی-اطلاعات {
            display: flex;
            justify-content: space-between;

            margin-bottom: 8px;

            color: #ccc;
        }

        .نوار-انرژی {
            width: 100%;
            height: 14px;

            background: #292d35;

            border-radius: 20px;

            overflow: hidden;
        }

        .انرژی {
            width: 100%;
            height: 100%;

            background: #ffd23f;

            transition: width 0.2s;
        }

        .راهنما {
            margin-top: 25px;

            color: #999;

            font-size: 14px;
        }

        /* سکه‌ای که هنگام کلیک ظاهر می‌شود */

        .سکه-شناور {
            position: fixed;

            color: #ffd23f;

            font-size: 24px;

            font-weight: bold;

            pointer-events: none;

            animation: بالا 0.8s forwards;
        }

        @keyframes بالا {

            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(-80px);
            }

        }

    </style>
</head>

<body>

<div class="بازی">

    <div class="عنوان">
        🪙 بازی سیبیلستر
    </div>


    <div class="سکه">

        <div class="سکه-عدد">
            🪙 <span id="سکه">0</span>
        </div>

        <div class="سکه-متن">
            سکه
        </div>

    </div>


    <!-- سیبیلستر -->

    <div
        class="سیبیلستر"
        id="سیبیلستر">

        🥸

    </div>


    <!-- انرژی -->

    <div>

        <div class="انرژی-اطلاعات">

            <span>⚡ انرژی</span>

            <span>
                <span id="انرژی-عدد">100</span>
                /
                100
            </span>

        </div>


        <div class="نوار-انرژی">

            <div
                class="انرژی"
                id="نوار">

            </div>

        </div>

    </div>


    <div class="راهنما">

        برای گرفتن سکه روی سیبیلستر بزن!

    </div>

</div>


<script>

    /* =========================
       اطلاعات بازی
    ========================= */

    let سکه =
        Number(localStorage.getItem("سکه")) || 0;

    let انرژی =
        Number(localStorage.getItem("انرژی"));

    if (isNaN(انرژی)) {
        انرژی = 100;
    }


    const حداکثر_انرژی = 100;


    /* =========================
       نمایش اطلاعات
    ========================= */

    function نمایش() {

        document.getElementById("سکه")
            .textContent =
            سکه.toLocaleString("fa-IR");


        document.getElementById("انرژی-عدد")
            .textContent =
            انرژی;


        document.getElementById("نوار")
            .style.width =
            انرژی + "%";
    }


    /* =========================
       ذخیره بازی
    ========================= */

    function ذخیره() {

        localStorage.setItem(
            "سکه",
            سکه
        );

        localStorage.setItem(
            "انرژی",
            انرژی
        );

    }


    /* =========================
       کلیک روی سیبیلستر
    ========================= */

    document
        .getElementById("سیبیلستر")
        .addEventListener("click", function(event) {

            /* اگر انرژی تمام شده باشد */

            if (انرژی <= 0) {

                return;

            }


            /* یک سکه */

            سکه += 1;


            /* مصرف انرژی */

            انرژی -= 1;


            /* نمایش سکه شناور */

            سکه_شناور(
                event.clientX,
                event.clientY
            );


            نمایش();

            ذخیره();

        });


    /* =========================
       سکه شناور
    ========================= */

    function سکه_شناور(x, y) {

        const نوشته =
            document.createElement("div");


        نوشته.className =
            "سکه-شناور";


        نوشته.textContent =
            "+۱ 🪙";


        نوشته.style.left =
            x + "px";


        نوشته.style.top =
            y + "px";


        document.body.appendChild(
            نوشته
        );


        setTimeout(function() {

            نوشته.remove();

        }, 800);

    }


    /* =========================
       بازیابی انرژی
       هر ثانیه 1 انرژی
    ========================= */

    setInterval(function() {

        if (انرژی < حداکثر_انرژی) {

            انرژی += 1;

            نمایش();

            ذخیره();

        }

    }, 1000);


    /* =========================
       شروع بازی
    ========================= */

    نمایش();

</script>

</body>
</html>
