<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل مهرسام هادی زاده</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #080b10;
            color: #fff;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        .profile {
            background: linear-gradient(145deg, #111722, #0c1017);
            border: 1px solid #202938;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,.5);
        }

        .photo-box {
            text-align: center;
            margin-bottom: 25px;
        }

        .photo-box img {
            width: 190px;
            height: 190px;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid #313b4d;
            box-shadow: 0 10px 35px rgba(0,0,0,.6);
        }

        h1 {
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .username {
            text-align: center;
            color: #6cff9b;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 17px;
            color: #6cff9b;
            margin: 25px 0 12px;
            border-right: 3px solid #6cff9b;
            padding-right: 10px;
        }

        .info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #151b25;
            border: 1px solid #222b39;
            padding: 14px 16px;
            border-radius: 13px;
            margin-bottom: 9px;
        }

        .label {
            color: #8995a7;
            font-size: 14px;
        }

        .value {
            color: #fff;
            font-weight: bold;
            font-size: 14px;
        }

        .social {
            color: #6cff9b;
            direction: ltr;
        }

        .sister {
            margin-top: 15px;
            background: linear-gradient(145deg, #141b27, #0f141d);
            border: 1px solid #293445;
            border-radius: 18px;
            padding: 18px;
        }

        .sister-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            color: #596575;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 500px) {
            .profile {
                padding: 18px;
            }

            .photo-box img {
                width: 160px;
                height: 160px;
            }

            .info {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="profile">

        <!-- عکس -->
        <div class="photo-box">
            <a href="https://imgurl.ir/" target="_blank" rel="noopener">
                <img src="https://cdn.imgurl.ir/uploads/n4047_IMG_20260917_181138.jpg"
                     alt="عکس مهرسام">
            </a>
        </div>

        <h1>مهرسام هادی زاده</h1>
        <div class="username">@mehrsam_hdz</div>

        <!-- اطلاعات مهرسام -->
        <div class="section-title">اطلاعات شخصی</div>

        <div class="info">
            <span class="label">نام</span>
            <span class="value">مهرسام</span>
        </div>

        <div class="info">
            <span class="label">نام خانوادگی</span>
            <span class="value">هادی زاده</span>
        </div>

        <div class="info">
            <span class="label">ایدی در فضای مجازی</span>
            <span class="value social">@mehrsam_hdz</span>
        </div>

        <div class="info">
            <span class="label">شماره</span>
            <span class="value" dir="ltr">+989014326146</span>
        </div>

        <div class="info">
            <span class="label">پایه تحصیلی</span>
            <span class="value">نهم</span>
        </div>

        <!-- اطلاعات خواهر -->
        <div class="section-title">اطلاعات خواهر</div>

        <div class="sister">

            <div class="sister-name">
                باران هادی زاده
            </div>

            <div class="info">
                <span class="label">نام</span>
                <span class="value">باران</span>
            </div>

            <div class="info">
                <span class="label">نام خانوادگی</span>
                <span class="value">هادی زاده</span>
            </div>

            <div class="info">
                <span class="label">پایه تحصیلی</span>
                <span class="value">هفتم</span>
            </div>

        </div>

        <div class="footer">
            Personal Profile
        </div>

    </div>

</div>

</body>
</html>
