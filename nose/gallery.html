
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>گالری تصاویر کوروش دماغ</title>

<meta name="description" content="گالری تصاویر کوروش دماغ">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Vazirmatn', sans-serif;
    background: #0d0d12;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Header */

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    width: 100%;
    padding: 15px;
    display: flex;
    justify-content: center;
    background: rgba(13,13,18,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,215,0,0.2);
}

.back-button {
    display: inline-block;
    padding: 12px 28px;
    border-radius: 50px;
    background: linear-gradient(135deg,#ffd700,#ff9500);
    color: #000;
    text-decoration: none;
    font-weight: 900;
    font-size: 15px;
    transition: .3s;
}

.back-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(255,215,0,.3);
}

/* Title */

.title {
    text-align: center;
    padding: 35px 15px 15px;
}

.title h1 {
    font-size: clamp(23px,5vw,36px);
    font-weight: 900;
    background: linear-gradient(90deg,#ffd700,#ff4d6d,#ffd700);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
}

.title p {
    color: #888;
    font-size: 13px;
    margin-top: 8px;
}

/* Gallery */

.gallery {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 20px 15px 50px;
    display: flex;
    flex-direction: column;
    gap: 22px;
}

.photo {
    width: 100%;
    background: #17171f;
    border: 1px solid rgba(255,215,0,.15);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,.35);
}

.photo img {
    display: block;
    width: 100%;
    height: auto;
    min-height: 100px;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
}

/* Footer */

footer {
    text-align: center;
    padding: 25px 15px;
    color: #666;
    font-size: 12px;
    border-top: 1px solid rgba(255,255,255,.06);
}

footer span {
    color: #ffd700;
}

@media (max-width: 600px) {
    .gallery {
        padding: 15px 10px 35px;
        gap: 15px;
    }

    .photo {
        border-radius: 13px;
    }

    .back-button {
        font-size: 13px;
        padding: 11px 23px;
    }
}
</style>
</head>

<body>

<header class="header">
    <a class="back-button" href="https://HlRUD.github.io/nose">
        👃 صفحه کوروش دماغ
    </a>
</header>

<section class="title">
