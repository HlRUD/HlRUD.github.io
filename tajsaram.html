<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاج سرم ایسا</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0f0f, #252525);
            color: white;
        }

        .card {
            width: 90%;
            max-width: 500px;
            padding: 50px 30px;
            text-align: center;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .crown {
            font-size: 55px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 34px;
            margin: 0 0 15px;
        }

        p {
            color: #aaa;
            font-size: 17px;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="crown">👑</div>
        <h1>تاج سرم ایسا</h1>
    </div>

</body>
</html>
