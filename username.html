<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HIRUD | لینک‌های من</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Tahoma, Arial, sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #0a0a0a, #171717);
            color: white;
        }

        .container {
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        .link {
            display: block;
            text-decoration: none;
            color: white;
            background: #222;
            margin: 15px 0;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #333;
            transition: 0.3s;
        }

        .link:hover {
            transform: translateY(-4px);
            background: #2c2c2c;
            border-color: #555;
        }

        .telegram {
            border-right: 5px solid #229ED9;
        }

        .splus {
            border-right: 5px solid #00c853;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .username {
            color: #aaa;
            direction: ltr;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>HIRUD</h1>
        <div class="subtitle">لینک‌های ارتباطی من</div>

        <a class="link telegram" href="https://t.me/HlRUD" target="_blank">
            <div class="title">Telegram</div>
            <div class="username">@HlRUD</div>
        </a>

        <a class="link splus" href="https://splus.ir/hirud" target="_blank">
            <div class="title">SPlus</div>
            <div class="username">@HIRUD</div>
        </a>

    </div>

</body>
</html>
